# Goes in the `http` context, for example /etc/nginx/conf.d/closeknit.conf.
# Plain HTTP for the Closeknit names is sent to HTTPS.

server {
	listen 80;
	listen [::]:80;
	server_name closeknit.eu *.closeknit.eu closeknit.nl www.closeknit.nl;
	return 301 https://$host$request_uri;
}
