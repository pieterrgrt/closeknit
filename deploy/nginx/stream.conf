# Goes at the top level of nginx (inside a `stream { include ...; }` block, not
# inside `http`). Port 443 is shared by SNI: names of Closeknit go to Caddy
# without being decrypted, all other names go to the existing sites, which then
# listen on 127.0.0.1:8444 with `proxy_protocol` and so still see the visitor's
# address. Caddy does not read PROXY protocol, so a small hop on 8446 removes it.

map $ssl_preread_server_name $closeknit_route {
	~*(^|\.)closeknit\.(eu|nl)$ closeknit;
	default                     legacy;
}

upstream closeknit {
	server 127.0.0.1:8446;
}

upstream legacy {
	server 127.0.0.1:8444;
}

server {
	listen 443;
	listen [::]:443;
	ssl_preread on;
	proxy_protocol on;
	proxy_pass $closeknit_route;
}

# Strips the PROXY protocol header and passes the TLS stream on to Caddy.
server {
	listen 127.0.0.1:8446 proxy_protocol;
	proxy_pass 127.0.0.1:18443;
}
