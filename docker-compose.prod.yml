# Production on a single server, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs the variables in deploy/env.example, in a `.env` next to this file.
# See docs/deploy.md.

services:
  db:
    # Reachable from the other containers only, not from the host.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  migrate:
    environment:
      DATABASE_OWNER_URL: postgres://closeknit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/closeknit
      DATABASE_URL: postgres://closeknit_web:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/closeknit

  web:
    # Only Caddy talks to the app.
    ports: !reset []
    environment:
      DATABASE_URL: postgres://closeknit_web:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/closeknit
      ORIGIN: ${ORIGIN:-https://closeknit.eu}

  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    restart: unless-stopped
    ports:
      # Defaults take the standard ports. Behind another proxy on the same server,
      # set CADDY_BIND=127.0.0.1 and CADDY_HTTP_PORT / CADDY_HTTPS_PORT in .env.
      - '${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      DNS_PROVIDER: ${DNS_PROVIDER:?set DNS_PROVIDER in .env (infomaniak or hetzner)}
      DNS_API_TOKEN: ${DNS_API_TOKEN:?set DNS_API_TOKEN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates live here; losing them means asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
